[project]
name = "base-project-backend"
version = "0.1.0"
description = "Reusable FastAPI + PostgreSQL foundation for new applications."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2,<0.143",
    "uvicorn[standard]>=0.54.0,<0.55",
    "sqlalchemy>=2.1.3,<2.2",
    "alembic>=1.20.0,<2",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic[email]>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "pwdlib[argon2]>=0.3.1,<0.4",
    "pyjwt>=2.15.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "httpx2>=2.13.1,<3",
    "ruff>=0.16.10,<0.17",
    "mypy>=2.4.0,<3",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff (linting + formatting; Black-compatible formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
]
ignore = [
    "B008", # FastAPI uses function calls (Depends/Query) in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"tests/conftest.py" = ["E402", "S101", "S105", "S608"]
"app/scripts/**" = ["S311"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "app/scripts/*"]
